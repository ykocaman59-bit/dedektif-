<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GPS Canlı Takip & Rota</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 15px; background: #f4f4f9; }
        .card { background: white; padding: 15px; border-radius: 8px; margin-bottom: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        input, select, button { width: 100%; padding: 10px; margin-top: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        button { background: #007bff; color: white; border: none; font-weight: bold; cursor: pointer; }
        button:hover { background: #0056b3; }
        .btn-secondary { background: #6c757d; }
        .btn-success { background: #28a745; }
        .btn-danger { background: #dc3545; }
        #map { height: 280px; width: 100%; border-radius: 6px; margin-top: 10px; }
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; }
        .modal-content { background: white; padding: 20px; border-radius: 8px; width: 90%; max-width: 350px; text-align: center; position: relative; }
        .close-btn { position: absolute; right: 10px; top: 5px; font-size: 20px; cursor: pointer; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    </style>
</head>
<body>

    <!-- Üst Menü / Profil Butonu (Başlangıçta Gizli, Giriş Yapınca Görünür) -->
    <div class="top-bar">
        <h2 style="margin:0; font-size: 18px;">GPS Dedektif</h2>
        <button id="profileNavBtn" onclick="openProfileModal()" style="width: auto; padding: 8px 15px; background: #343a40; display: none;">Profil / IP</button>
    </div>

    <!-- Giriş Yap Paneli -->
    <div class="card" id="loginCard">
        <h3>Sisteme Giriş Yap</h3>
        <input type="email" id="loginEmail" placeholder="Gmail Adresi">
        <input type="password" id="loginPassword" placeholder="Şifre">
        <button onclick="handleLogin()">Giriş Yap</button>
        <button class="btn-secondary" onclick="showRegisterForm()" style="margin-top: 5px;">Hesabınız yok mu? Kayıt Ol</button>
    </div>

    <!-- Kayıt Ol Paneli (Başlangıçta Gizli) -->
    <div class="card" id="registerCard" style="display: none;">
        <h3>Yeni Hesap Kaydı</h3>
        <input type="text" id="regFullName" placeholder="İsim Soyisim">
        <input type="text" id="regUsername" placeholder="Kullanıcı Adı">
        <input type="email" id="regEmail" placeholder="Gmail Adresi">
        <input type="tel" id="regPhone" placeholder="Telefon Numarası">
        <input type="password" id="regPassword" placeholder="Şifre">
        <button onclick="handleRegister()" class="btn-success">Kayıt Ol</button>
        <button class="btn-secondary" onclick="showLoginForm()" style="margin-top: 5px;">Zaten hesabın var mı? Giriş Yap</button>
    </div>

    <!-- Ana Uygulama Paneli (Giriş Yapılınca Görünür) -->
    <div class="card" id="appCard" style="display:none;">
        <h3 id="welcomeUserText">Hoş geldiniz</h3>
        <button class="btn-danger" onclick="logout()">Çıkış Yap</button>
    </div>

    <!-- Cihaz Eşleme ve Rota Paneli -->
    <div class="card" id="trackingCard" style="display:none;">
        <h3>Cihaz Eşleme & Rota</h3>
        <input type="text" id="targetIpInput" placeholder="Hedef 12 haneli IP adresini girin">
        
        <label style="font-size: 13px; font-weight: bold; display: block; margin-top: 10px;">Ulaşım Modu:</label>
        <select id="travelMode">
            <option value="car">Araba (Araç Rotası)</option>
            <option value="foot">İnsan (Yaya Rotası)</option>
        </select>

        <button onclick="pairAndRouteDevice()" class="btn-success">Rotayı Oluştur</button>
        <button onclick="startNavigation()" class="btn-secondary" style="margin-top: 5px;">Başla (Sesli Asistan)</button>
    </div>

    <!-- Canlı Harita Paneli -->
    <div class="card" id="mapCard" style="display:none;">
        <h3>Canlı GPS Konum</h3>
        <div id="map"></div>
    </div>

    <!-- Profil ve IP Paneli Modalı -->
    <div id="profileModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeProfileModal()">&times;</span>
            <h3>Profil Bilgileri</h3>
            <p><strong>Ad Soyad:</strong> <span id="modalFullName">-</span></p>
            <p><strong>Kullanıcı Adı:</strong> <span id="modalUsername">-</span></p>
            <p><strong>Kayıtlı E-posta:</strong> <span id="modalEmail">-</span></p>
            <p><strong>Telefon:</strong> <span id="modalPhone">-</span></p>
            <p><strong>Cihaz IP Adresiniz (12 Haneli):</strong></p>
            <input type="text" id="myUniqueIpDisplay" readonly style="background: #e9ecef; text-align: center; font-weight: bold;">
            <button onclick="copyIpToClipboard()" class="btn-success" style="margin-top: 5px;">IP Adresini Panoya Kopyala</button>
            <button onclick="confirmDeleteAccount()" class="btn-danger" style="margin-top: 10px;">Hesabımı Sil</button>
        </div>
    </div>

    <!-- Hesap Silme Onay Modalı -->
    <div id="deleteConfirmModal" class="modal">
        <div class="modal-content">
            <h4 style="color: #dc3545; margin-top:0;">Hesap Silme Onayı</h4>
            <p>Hesabınızı silmek istediğinizden emin misiniz?</p>
            <div style="display: flex; gap: 10px; margin-top: 15px;">
                <button onclick="deleteAccountYes()" class="btn-danger" style="flex:1;">Evet</button>
                <button onclick="deleteAccountNo()" class="btn-secondary" style="flex:1;">Hayır</button>
            </div>
        </div>
    </div>

    <!-- Genel Uyarı Modalı -->
    <div id="customModal" class="modal">
        <div class="modal-content">
            <h4 style="margin-top:0; color:#dc3545;">Uyarı</h4>
            <p id="modalMessage">Mesaj</p>
            <button onclick="closeModal()">Tamam</button>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="app.js"></script>
</body>
</html>
