<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GPS Canlı Takip</title>
    <!-- Leaflet Harita Kütüphanesi -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 15px; background: #f4f4f9; }
        .card { background: white; padding: 15px; border-radius: 8px; margin-bottom: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        input, button { width: 100%; padding: 10px; margin-top: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        button { background: #007bff; color: white; border: none; font-weight: bold; cursor: pointer; }
        button:hover { background: #0056b3; }
        #map { height: 250px; width: 100%; border-radius: 6px; margin-top: 10px; }
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; }
        .modal-content { background: white; padding: 20px; border-radius: 8px; width: 85%; max-width: 300px; text-align: center; }
    </style>
</head>
<body>

    <!-- Gmail Giriş Paneli -->
    <div class="card" id="loginCard">
        <h3>Gmail ile Giriş Yap</h3>
        <p>Devam etmek için lütfen bir Google (Gmail) hesabı seçin:</p>
        <button onclick="openGmailSelector()">Google Hesabı Seç</button>
    </div>

    <!-- Ana Uygulama Paneli -->
    <div class="card" id="appCard" style="display:none;">
        <h3 id="userEmailDisplay">Hoş geldiniz</h3>
        <button onclick="logout()" style="background: #dc3545;">Çıkış Yap</button>
    </div>

    <!-- Cihaz Eşleme Paneli -->
    <div class="card">
        <h3>Cihaz Eşleme</h3>
        <input type="text" id="targetIpInput" placeholder="Takip edilecek IP adresini girin">
        <button onclick="pairDevice()">Eşleşmeyi Başlat</button>
    </div>

    <!-- Canlı Harita Paneli -->
    <div class="card">
        <h3>Canlı Konum Takibi</h3>
        <div id="map"></div>
    </div>

    <!-- Özel Uyarı Modalı -->
    <div id="customModal" class="modal">
        <div class="modal-content">
            <h4 style="margin-top:0; color:#dc3545;">Hata / Uyarı</h4>
            <p id="modalMessage">Kendi IP adresinizi giremezsiniz!</p>
            <button onclick="closeModal()">Tamam</button>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="app.js"></script>
</body>
</html>
