<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GPS Takip - Canlı Konum ve Navigasyon</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- GİRİŞ EKRANI -->
    <div id="login-screen" class="screen active">
        <div class="auth-card">
            <h2>GPS Takip Giriş</h2>
            <input type="email" id="login-email" placeholder="Gmail adresiniz">
            <input type="password" id="login-password" placeholder="Şifreniz">
            <button id="btn-login" class="btn-primary">Giriş Yap</button>
            <p>Hesabınız yok mu? <a href="#" id="go-to-register">Kayıt Ol</a></p>
        </div>
    </div>

    <!-- KAYIT EKRANI -->
    <div id="register-screen" class="screen">
        <div class="auth-card">
            <h2>Kayıt Ol</h2>
            <input type="text" id="reg-fullname" placeholder="Ad Soyad">
            <input type="text" id="reg-username" placeholder="Kullanıcı Adı">
            <input type="email" id="reg-email" placeholder="Gmail adresi (@gmail.com)">
            <input type="text" id="reg-phone" placeholder="Telefon Numarası">
            <input type="password" id="reg-password" placeholder="Şifre">
            <button id="btn-register" class="btn-primary">Kayıt Ol ve IP Üret</button>
            <p>Zaten hesabınız var mı? <a href="#" id="go-to-login">Giriş Yap</a></p>
        </div>
    </div>

    <!-- PROFİL / ANA EKRAN -->
    <div id="profile-screen" class="screen">
        <div class="profile-card">
            <h2>Kullanıcı Profili</h2>
            <p><strong>Ad Soyad:</strong> <span id="prof-name"></span></p>
            <p><strong>Kullanıcı Adı:</strong> <span id="prof-username"></span></p>
            <p><strong>E-posta:</strong> <span id="prof-email"></span></p>
            <p><strong>Cihaz IP ID (12 Hane):</strong> <span id="prof-ip" class="ip-badge"></span></p>
            
            <div class="pairing-section">
                <h3>Cihaz Eşleştir</h3>
                <input type="text" id="target-ip-input" placeholder="Karşı tarafın 12 haneli IP ID'si">
                <button id="btn-pair" class="btn-secondary">Cihaza Bağlan</button>
            </div>

            <button id="btn-open-map" class="btn-primary">Haritayı Aç ve Takip Et</button>
        </div>
    </div>

    <!-- HARİTA VE NAVİGASYON EKRANI -->
    <div id="map-screen" class="screen">
        <div id="map"></div>
        <div class="map-controls">
            <div mode-selector>
                <button id="mode-car" class="mode-btn active">Araç</button>
                <button id="mode-foot" class="mode-btn">Yaya</button>
            </div>
            <button id="btn-speak" class="btn-secondary">🎤 Sesli Navigasyon</button>
            <button id="btn-back-profile" class="btn-danger">Profile Dön</button>
        </div>
    </div>

    <!-- Supabase CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="app.js"></script>
</body>
</html>
