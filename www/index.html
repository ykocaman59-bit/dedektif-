<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GPS Takip - Canlı Konum ve Navigasyon</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body, html {
            width: 100%;
            height: 100%;
            background-color: #f4f6f9;
        }

        .screen {
            display: none;
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
        }

        .screen.active {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .auth-card, .profile-card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 90%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .auth-card h2, .profile-card h2 {
            color: #333;
            text-align: center;
            margin-bottom: 10px;
        }

        input {
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }

        .btn-primary { background-color: #2563eb; color: white; }
        .btn-primary:hover { background-color: #1d4ed8; }

        .btn-secondary { background-color: #10b981; color: white; }
        .btn-secondary:hover { background-color: #059669; }

        .btn-danger { background-color: #ef4444; color: white; }
        .btn-danger:hover { background-color: #dc2626; }

        .btn-disabled-gray {
            background-color: #94a3b8 !important;
            color: #f1f5f9 !important;
            cursor: not-allowed !important;
        }

        p { text-align: center; color: #666; font-size: 14px; }
        p a { color: #2563eb; text-decoration: none; font-weight: bold; }

        .ip-badge {
            background: #e2e8f0;
            padding: 4px 8px;
            border-radius: 4px;
            font-family: monospace;
            font-weight: bold;
            color: #1e293b;
        }

        .pairing-section {
            border-top: 1px solid #eee;
            padding-top: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        #map {
            width: 100%;
            height: 100%;
        }

        .map-controls {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            display: flex;
            gap: 10px;
            background: white;
            padding: 10px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>
    <!-- GİRİŞ EKRANI -->
    <div id="login-screen" class="screen active">
        <div class="auth-card">
            <h2>GPS Takip Giriş</h2>
            <input type="email" id="login-email" placeholder="Gmail adresiniz">
            <input type="password" id="login-password" placeholder="Şifreniz">
            <button id="btn-login" class="btn-primary">Giriş Yap</button>
            <p>Hesabınız yok mu? <a href="#" id="go-to-register">Kayıt Ol</a></p>
        </div>
    </div>

    <!-- KAYIT EKRANI -->
    <div id="register-screen" class="screen">
        <div class="auth-card">
            <h2>Kayıt Ol</h2>
            <input type="text" id="reg-fullname" placeholder="Ad Soyad">
            <input type="text" id="reg-username" placeholder="Kullanıcı Adı">
            <input type="tel" id="reg-phone" placeholder="Telefon Numarası (Örn: 05... )">
            <input type="email" id="reg-email" placeholder="Gmail adresi (@gmail.com)">
            <input type="password" id="reg-password" placeholder="Şifre">
            <button id="btn-register" class="btn-primary">Kayıt Ol ve IP Üret</button>
            <p>Zaten hesabınız var mı? <a href="#" id="go-to-login">Giriş Yap</a></p>
        </div>
    </div>

    <!-- PROFİL / ANA EKRAN -->
    <div id="profile-screen" class="screen">
        <div class="profile-card">
            <h2>Kullanıcı Profili</h2>
            <p><strong>Ad Soyad:</strong> <span id="prof-name"></span></p>
            <p><strong>Kullanıcı Adı:</strong> <span id="prof-username"></span></p>
            <p><strong>Telefon:</strong> <span id="prof-phone"></span></p>
            <p><strong>E-posta:</strong> <span id="prof-email"></span></p>
            <p><strong>Cihaz IP ID (12 Hane):</strong> <span id="prof-ip" class="ip-badge"></span></p>
            
            <div class="pairing-section">
                <h3>Cihaz Eşleştir</h3>
                <input type="text" id="target-ip-input" placeholder="12 haneli hedef IP ID'si">
                <button id="btn-pair" class="btn-secondary">Cihaza Bağlan</button>
            </div>

            <button id="btn-open-map" class="btn-primary btn-disabled-gray" disabled>Haritayı Aç ve Takip Et</button>
            <button id="btn-logout" class="btn-danger">Oturumu Kapat</button>
        </div>
    </div>

    <!-- HARİTA VE NAVİGASYON EKRANI -->
    <div id="map-screen" class="screen">
        <div id="map"></div>
        <div class="map-controls">
            <button id="btn-speak" class="btn-secondary">🎤 Sesli Navigasyon</button>
            <button id="btn-back-profile" class="btn-danger">Profile Dön</button>
        </div>
    </div>

    <!-- Supabase CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <script>
        const SUPABASE_URL = 'https://tlsvemiagjctqvwrosup.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRsc3ZlbWlhZ2JjdHF2d3Jvc3VwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA1NTkyODMsImV4cCI6MjEwNjEzNTI4M30.fl2bk2Uar-Lujdz8rr7hni0V5eKZQV8klgUSBLooB_8';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let currentUser = null;
        let map, marker, targetMarker;
        let watchId = null;
        let syncInterval = null;

        window.addEventListener('DOMContentLoaded', () => {
            const savedUser = localStorage.getItem('gps_current_user');
            if (savedUser) {
                currentUser = JSON.parse(savedUser);
                loadProfileData();
                showScreen('profile-screen');
            }
        });

        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }

        function generateUniqueIP() {
            let result = '';
            const characters = '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ';
            for (let i = 0; i < 12; i++) {
                result += characters.charAt(Math.floor(Math.random() * characters.length));
            }
            return result;
        }

        function loadProfileData() {
            document.getElementById('prof-name').innerText = currentUser.full_name || '';
            document.getElementById('prof-username').innerText = currentUser.username || '';
            document.getElementById('prof-phone').innerText = currentUser.phone || '';
            document.getElementById('prof-email').innerText = currentUser.email || '';
            document.getElementById('prof-ip').innerText = currentUser.ip_id || '';

            if (currentUser.target_ip) {
                document.getElementById('target-ip-input').value = currentUser.target_ip;
                activateMapButton();
            }
        }

        function activateMapButton() {
            const mapBtn = document.getElementById('btn-open-map');
            mapBtn.classList.remove('btn-disabled-gray');
            mapBtn.classList.add('btn-primary');
            mapBtn.removeAttribute('disabled');
        }

        document.getElementById('go-to-register').addEventListener('click', (e) => { e.preventDefault(); showScreen('register-screen'); });
        document.getElementById('go-to-login').addEventListener('click', (e) => { e.preventDefault(); showScreen('login-screen'); });
        
        document.getElementById('btn-logout').addEventListener('click', () => {
            localStorage.removeItem('gps_current_user');
            currentUser = null;
            if(watchId) navigator.geolocation.clearWatch(watchId);
            if(syncInterval) clearInterval(syncInterval);
            showScreen('login-screen');
        });

        document.getElementById('btn-back-profile').addEventListener('click', () => {
            showScreen('profile-screen');
            if(watchId) navigator.geolocation.clearWatch(watchId);
            if(syncInterval) clearInterval(syncInterval);
        });

        // Kayıt Olma (user_profiles tablosu güncellendi)
        document.getElementById('btn-register').addEventListener('click', async () => {
            const full_name = document.getElementById('reg-fullname').value.trim();
            const username = document.getElementById('reg-username').value.trim();
            const phone = document.getElementById('reg-phone').value.trim();
            const email = document.getElementById('reg-email').value.trim();
            const password = document.getElementById('reg-password').value.trim();

            if (!email.endsWith('@gmail.com')) {
                alert('Lütfen geçerli bir @gmail.com adresi girin!');
                return;
            }

            const ip_id = generateUniqueIP();

            const { error } = await supabaseClient
                .from('user_profiles')
                .insert([{ full_name, username, phone, email, password, ip_id }]);

            if (error) {
                alert('Kayıt Hatası: ' + error.message);
            } else {
                alert('Kayıt başarılı! Cihaz IP ID\'niz: ' + ip_id);
                showScreen('login-screen');
            }
        });

        // Giriş Yapma (user_profiles tablosu güncellendi)
        document.getElementById('btn-login').addEventListener('click', async () => {
            const email = document.getElementById('login-email').value.trim();
            const password = document.getElementById('login-password').value.trim();

            const { data, error } = await supabaseClient
                .from('user_profiles')
                .select('*')
                .eq('email', email)
                .eq('password', password)
                .single();

            if (error || !data) {
                alert('Giriş başarısız! E-posta veya şifre hatalı.');
            } else {
                currentUser = data;
                localStorage.setItem('gps_current_user', JSON.stringify(currentUser));
                loadProfileData();
                showScreen('profile-screen');
            }
        });

        // Cihaz Eşleştirme (user_profiles tablosu güncellendi)
        document.getElementById('btn-pair').addEventListener('click', async () => {
            const targetIp = document.getElementById('target-ip-input').value.trim();
            if (!targetIp || targetIp.length !== 12) {
                alert('Lütfen geçerli 12 haneli bir IP ID girin!');
                return;
            }

            const { data, error } = await supabaseClient
                .from('user_profiles')
                .select('ip_id, full_name')
                .eq('ip_id', targetIp)
                .single();

            if (error || !data) {
                alert('Bu IP adresine sahip bir cihaz bulunamadı!');
                return;
            }

            currentUser.target_ip = targetIp;
            localStorage.setItem('gps_current_user', JSON.stringify(currentUser));
            
            activateMapButton();
            alert(`${data.full_name} adlı cihazla başarıyla eşleştirildi! Harita butonu aktifleşti.`);
        });

        // Haritayı Aç
        document.getElementById('btn-open-map').addEventListener('click', () => {
            showScreen('map-screen');
            initMap();
        });

        function initMap() {
            if (!map) {
                map = L.map('map').setView([41.0082, 28.9784], 13);
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                    maxZoom: 19,
                }).addTo(map);
            } else {
                map.invalidateSize();
            }

            if (navigator.geolocation) {
                watchId = navigator.geolocation.watchPosition(async position => {
                    const lat = position.coords.latitude;
                    const lng = position.coords.longitude;

                    if (!marker) {
                        marker = L.marker([lat, lng]).addTo(map).bindPopup('Siz Buradasınız').openPopup();
                    } else {
                        marker.setLatLng([lat, lng]);
                    }

                    // Konum Güncelleme (user_profiles tablosu güncellendi)
                    await supabaseClient
                        .from('user_profiles')
                        .update({ latitude: lat, longitude: lng, updated_at: new Date() })
                        .eq('id', currentUser.id);

                }, err => console.log('Konum alınamadı: ' + err.message), { enableHighAccuracy: true });
            }

            syncInterval = setInterval(async () => {
                if (!currentUser.target_ip) return;

                // Hedef Konum Çekme (user_profiles tablosu güncellendi)
                const { data, error } = await supabaseClient
                    .from('user_profiles')
                    .select('latitude, longitude, full_name')
                    .eq('ip_id', currentUser.target_ip)
                    .single();

                if (!error && data && data.latitude && data.longitude) {
                    const targetLat = data.latitude;
                    const targetLng = data.longitude;

                    if (!targetMarker) {
                        targetMarker = L.marker([targetLat, targetLng], {
                            icon: L.icon({
                                iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-red.png',
                                shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.7.1/images/marker-shadow.png',
                                iconSize: [25, 41],
                                iconAnchor: [12, 41]
                            })
                        }).addTo(map).bindPopup(`Hedef: ${data.full_name}`).openPopup();
                    } else {
                        targetMarker.setLatLng([targetLat, targetLng]);
                    }
                }
            }, 4000);
        }

        document.getElementById('btn-speak').addEventListener('click', () => {
            if ('speechSynthesis' in window) {
                const utterance = new SpeechSynthesisUtterance("Canlı takip ve rota yönlendirmesi aktif.");
                utterance.lang = 'tr-TR';
                window.speechSynthesis.speak(utterance);
            } else {
                alert('Tarayıcınız sesli komut özelliğini desteklemiyor.');
            }
        });
    </script>
</body>
</html>
