<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GPS Takip & Konum</title>
    <!-- Harita için Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- Özel Tasarım Dosyamız -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="app-container">
        <header>
            <h2>GPS Takip Sistemi</h2>
            <span id="connection-status">Firebase Bağlanıyor...</span>
        </header>

        <!-- Harita Alanı -->
        <div id="map"></div>

        <!-- Kontrol Paneli -->
        <div id="controls">
            <button id="btn-share" class="btn primary">Konumumu Paylaş</button>
            <button id="btn-stop" class="btn danger" disabled>Paylaşımı Durdur</button>
        </div>
    </div>

    <!-- Firebase SDK'ları (Compat sürümü - Yerel mobil testler için en kararlısı) -->
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>

    <!-- Harita için Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <!-- Bizim JavaScript Dosyamız -->
    <script src="script.js"></script>
</body>
</html>
