<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giriş ve Kayıt Ekranı</title>
    <!-- Stil Dosyası Bağlantısı -->
    <link rel="stylesheet" href="style.css">
    <!-- Supabase Kütüphanesi -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div class="container">
        <div id="auth-container">
            <h2 id="form-title">Giriş Yap</h2>
            
            <div class="input-group">
                <input type="email" id="email" placeholder="E-posta adresiniz">
            </div>
            <div class="input-group">
                <input type="password" id="password" placeholder="Şifreniz">
            </div>
            
            <button id="submit-btn" onclick="handleAuth()">Giriş Yap</button>
            <p id="toggle-text" onclick="toggleMode()">Hesabın yok mu? Kayıt ol</p>
            <p id="error-msg" class="error"></p>
        </div>

        <div id="app-container" style="display: none;">
            <h2>Hoş Geldiniz!</h2>
            <p>Başarıyla giriş yaptınız.</p>
            <button onclick="handleLogout()">Çıkış Yap</button>
        </div>
    </div>

    <!-- JavaScript Dosyası Bağlantısı -->
    <script src="script.js"></script>
</body>
</html>
