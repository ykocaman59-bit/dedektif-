Name: Android APK Build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Kodları Depodan Çek
        uses: actions/checkout@v4

      - name: Node.js Ortamını Kur
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Proje Bağımlılıklarını Yükle
        run: |
          npm install

      - name: Java (JDK 17) Ortamını Kur
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Android SDK ve Build Tools Ortamını Hazırla
        run: |
          echo "y" | sudo ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --sdk_root=${ANDROID_HOME} "platforms;android-33" "build-tools;33.0.2" "platform-tools"

      - name: Web Dosyalarını www Klasörüne Otomatik Taşı
        run: |
          mkdir -p www
          if [ -f "index.html" ]; then cp index.html www/; fi
          if [ -f "app.js" ]; then cp app.js www/; fi

      - name: Capacitor Android Paketini Derle
        run: |
          rm -rf android
          npx cap add android
          npx cap sync android

      - name: Android Manifest Dosyasına Tüm İzinleri Ekle
        run: |
          MANIFEST_PATH="android/app/src/main/AndroidManifest.xml"
          
          # </manifest> etiketinden hemen önce gerekli tüm izinleri ekliyoruz
          sed -i '/<\/manifest>/i \
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\
              <uses-permission android:name="android.permission.CAMERA" />\
              <uses-permission android:name="android.permission.RECORD_AUDIO" />\
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\
              <uses-permission android:name="android.permission.ACTIVITY_RECOGNITION" />\
              <uses-permission android:name="android.permission.READ_CONTACTS" />\
              <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />\
              <uses-permission android:name="android.permission.ACCESS_BACKGROUND_LOCATION" />' "$MANIFEST_PATH"

      - name: Gradle ile Debug APK Oluştur ve Yeniden Adlandır
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/GPS-Takip.apk

      - name: APK Dosyasını Kaydet (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: GPS Takip
          path: android/app/build/outputs/apk/debug/GPS-Takip.apk
          
